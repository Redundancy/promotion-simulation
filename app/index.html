<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Promotion Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="sim-concepts/shared.css" />
<link rel="stylesheet" href="prototype/style.css" />

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script>
  // Capture the underlying error (not just React's "above error occurred"
  // wrapper) so we have a stack to look at when something blows up.
  window.__lastError = null;
  window.addEventListener("error", function (ev) {
    if (ev.error && !window.__lastError) {
      window.__lastError = {
        message: ev.error.message,
        stack: ev.error.stack,
        ts: Date.now(),
      };
      console.error("[capture] underlying error:", ev.error.message, ev.error.stack);
    }
  }, true);
</script>

<!-- Order matters: data.jsx defines defineScenario; scenarios register
     themselves into window.SCENARIOS; api.jsx provides makeDirectiveAPI;
     state.jsx reads scenarios at boot. -->
<!-- Cache-bust query param. Bump when scripts change so Babel-standalone
     doesn't re-use cached compiles. (Babel fetches via XHR; some browsers
     hold onto previous responses even with no-store, so version-stamping
     is the reliable fix.) -->
<script>document.write([
  "data.jsx",
  "scenarios/api.jsx",
  "scenarios/s1-onboarding.jsx",
  "scenarios/s2-promotion.jsx",
  "scenarios/s3-branch-per-env.jsx",
  "runtime.jsx",
  "state.jsx",
  "editor.jsx",
  "topology.jsx",
  "scenes.jsx",
  "app.jsx",
].map(p => `<script type="text/babel" src="prototype/${p}?v=${Date.now()}"></sc`+`ript>`).join("\n"));
</script>

</body>
</html>
